<!DOCTYPE html>

      extend: {

          surface: "#121927", "surface-card": "#151C2C",
          primary: "#FF5E3A", "primary-hover": "#FF4828",
          "accent-blue": "#38BDF8", "accent-teal": "#2DD4BF",

<style>

  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

<script>
// ============================================================
// Config / storage helpers
// ============================================================
function getApiBase() { return localStorage.getItem('voyageur_api_base') || 'http://127.0.0.1:8000'; }
function getUserId() {
  let uid = localStorage.getItem('voyageur_user_id');
  if (!uid) { uid = 'user_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('voyageur_user_id', uid); }
  return uid;
}
function getSessionId() { return localStorage.getItem('voyageur_session_id') || null; }
function setSessionId(id) { localStorage.setItem('voyageur_session_id', id); }
function openSettings() {
  const next = prompt('Backend API base URL:', getApiBase());
  if (next) { localStorage.setItem('voyageur_api_base', next); renderFooter(); }
}
function renderFooter() { document.getElementById('apiBaseFooter').textContent = getApiBase(); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtINR(n) { if (n === null || n === undefined || isNaN(n)) return '—'; return '₹' + Math.round(Number(n)).toLocaleString('en-IN'); }
function prettyStatus(s) {
  if (!s) return 'In progress';
  const map = { generated: 'Itinerary confirmed', generated_with_issues: 'Generated — some issues noted', collecting: 'Collecting details' };
  if (map[s]) return map[s];
  return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// ============================================================
// Local trip history (backend has no "list sessions by name" title,
// so we keep display titles client-side; canonical data still comes
// from GET /trips and GET /trip/{session_id}).
// ============================================================
function getHistory() { try { return JSON.parse(localStorage.getItem('voyageur_history') || '[]'); } catch(e) { return []; } }
function saveHistoryList(list) { localStorage.setItem('voyageur_history', JSON.stringify(list)); }
function upsertHistory(sessionId, title, subtitle) {
  const list = getHistory();
  const idx = list.findIndex(h => h.session_id === sessionId);
  const entry = { session_id: sessionId, title: title || 'New trip', subtitle: subtitle || '', updated: Date.now() };
  if (idx >= 0) list[idx] = entry; else list.unshift(entry);
  list.sort((a,b) => b.updated - a.updated);
  saveHistoryList(list);
  renderHistory();
}

async function refreshServerTrips() {
  try {
    const res = await fetch(`${getApiBase()}/trips?user_id=${encodeURIComponent(getUserId())}`);
    if (!res.ok) return;
    const data = await res.json();
    const trips = data.trips || [];
    const local = getHistory();
    trips.forEach(t => {
      const sid = t.session_id || t.id;
      if (!sid) return;
      const idx = local.findIndex(h => h.session_id === sid);
      const title = t.destination || t.title || (idx >= 0 ? local[idx].title : 'Trip');
      const subtitle = t.status || (idx >= 0 ? local[idx].subtitle : '');
      const entry = { session_id: sid, title, subtitle, updated: idx >= 0 ? local[idx].updated : Date.now() };
      if (idx >= 0) local[idx] = entry; else local.push(entry);
    });
    local.sort((a,b) => b.updated - a.updated);
    saveHistoryList(local);
    renderHistory();
  } catch (e) { /* backend may not support this yet -- fine, local history still works */ }
}

function renderHistory() {
  const list = getHistory();
  const el = document.getElementById('history-list');
  const current = getSessionId();
  if (!list.length) {
    el.innerHTML = '<div class="text-slate-500 text-xs px-2 py-4 text-center">No trips yet — start a new one.</div>';
    return;
  }
  el.innerHTML = list.map(h => `
    <button onclick="switchSession('${h.session_id}')" class="text-left px-3 py-2.5 rounded-xl border transition-all ${h.session_id === current ? 'bg-gradient-to-r from-orange-950/50 to-rose-950/40 border-primary/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700 hover:bg-slate-900'}">
      <div class="text-xs font-bold text-slate-100 truncate">${escapeHtml(h.title)}</div>
      ${h.subtitle ? `<div class="text-[10px] text-slate-500 mt-0.5 truncate">${escapeHtml(h.subtitle)}</div>` : ''}
    </button>
  `).join('');
}

function toggleHistory(open) {
  const drawer = document.getElementById('historyDrawer');
  const backdrop = document.getElementById('historyBackdrop');
  if (open) { backdrop.classList.remove('hidden'); requestAnimationFrame(()=>drawer.classList.remove('-translate-x-full')); }
  else { drawer.classList.add('-translate-x-full'); setTimeout(()=>backdrop.classList.add('hidden'), 280); }
}
function toggleChat(open) {
  const drawer = document.getElementById('chatDrawer');
  const backdrop = document.getElementById('chatBackdrop');
  if (open) { backdrop.classList.remove('hidden'); requestAnimationFrame(()=>drawer.classList.remove('translate-x-full')); }
  else { drawer.classList.add('translate-x-full'); setTimeout(()=>backdrop.classList.add('hidden'), 280); }
}
function toggleExplore(open) {
  const drawer = document.getElementById('exploreDrawer');
  const backdrop = document.getElementById('exploreBackdrop');
  if (open) { backdrop.classList.remove('hidden'); requestAnimationFrame(()=>drawer.classList.remove('translate-x-full')); document.getElementById('placeInput').focus(); }
  else { drawer.classList.add('translate-x-full'); setTimeout(()=>backdrop.classList.add('hidden'), 280); }
}

// ============================================================
// Explore: categorized "places to visit" lookup (GET /places)
// ============================================================
const CATEGORY_ICONS = ['temple_buddhist', 'water_drop', 'forest', 'museum', 'diversity_3', 'landscape'];
const CATEGORY_COLORS = ['rose', 'cyan', 'emerald', 'amber', 'purple', 'indigo'];

async function searchPlaces() {
  const input = document.getElementById('placeInput');
  const destination = input.value.trim();
  const results = document.getElementById('placesResults');
  if (!destination) return;

  results.innerHTML = `<div class="text-center text-slate-500 text-xs py-16"><span class="material-symbols-outlined text-[28px] animate-spin block mb-2">progress_activity</span>Searching places in ${escapeHtml(destination)}…</div>`;

  try {
    const res = await fetch(`${getApiBase()}/places?destination=${encodeURIComponent(destination)}`);
    if (!res.ok) {
      results.innerHTML = `<div class="text-center text-rose-400 text-xs py-16">Couldn't fetch places (${res.status}). Try again.</div>`;
      return;
    }
    const guide = await res.json();
    renderPlacesGuide(guide);
  } catch (err) {
    results.innerHTML = `<div class="text-center text-rose-400 text-xs py-16">Couldn't reach the server: ${escapeHtml(err.message)}</div>`;
  }
}

function renderPlacesGuide(guide) {
  const results = document.getElementById('placesResults');
  results.innerHTML = buildPlacesGuideHtml(guide);
}

function buildPlacesGuideHtml(guide) {
  const cats = guide.categories || [];
  if (!cats.length) {
    return `<div class="text-center text-slate-500 text-xs py-6">${escapeHtml(guide.intro || 'No results found for this place.')}</div>`;
  }
  const header = `
    <div class="fade-in">
      <h3 class="text-lg font-extrabold text-white">${escapeHtml(guide.destination)}</h3>
      <p class="text-xs text-slate-400 mt-1 leading-relaxed">${escapeHtml(guide.intro || '')}</p>
    </div>`;
  const sections = cats.map((cat, ci) => {
    const color = CATEGORY_COLORS[ci % CATEGORY_COLORS.length];
    const c = COLOR_CLASSES[color];
    const icon = CATEGORY_ICONS[ci % CATEGORY_ICONS.length];
    const items = (cat.places || []).map(p => `
      <div class="bg-[#141C2C]/95 border ${c.border} ${c.hoverBorder} rounded-xl p-3 transition-all">
        <div class="text-sm font-bold text-white">${escapeHtml(p.name)}</div>
        <p class="text-xs text-slate-300 mt-1 leading-relaxed">${escapeHtml(p.description || '')}</p>
        ${p.source_url ? `<a href="${escapeHtml(p.source_url)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[10px] font-semibold ${color==='rose'?'text-rose-300':color==='cyan'?'text-cyan-300':color==='emerald'?'text-emerald-300':color==='amber'?'text-amber-300':color==='purple'?'text-purple-300':'text-indigo-300'} mt-2 hover:underline"><span class="material-symbols-outlined text-[13px]">open_in_new</span>Source</a>` : ''}
      </div>`).join('');
    return `
      <div class="fade-in">
        <div class="flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wide ${c.text.replace('group-hover:','')} mb-2">
          <span class="material-symbols-outlined text-[16px]">${icon}</span> ${escapeHtml(cat.category)}
        </div>
        <div class="flex flex-col gap-2">${items}</div>
      </div>`;
  }).join('');
  return header + sections;
}

// Detects chat messages like "places to visit in Chennai" / "things to do
// in Ooty" / "what to see in Kyoto" and returns the extracted destination,
// or null if the message doesn't match this intent.
function detectPlacesIntent(text) {
  const patterns = [
    /\b(?:places?|spots?|attractions?)\s+to\s+(?:visit|see|go|explore)\s+(?:in|at|near)\s+(.+)/i,
    /\bthings?\s+to\s+do\s+(?:in|at|near)\s+(.+)/i,
    /\bwhat\s+to\s+see\s+(?:in|at|near)\s+(.+)/i,
    /\btourist\s+spots?\s+(?:in|at|near)\s+(.+)/i,
    /\bsightseeing\s+(?:in|at|near)\s+(.+)/i,
  ];
  for (const re of patterns) {
    const m = text.match(re);
    if (m && m[1]) {
      return m[1].trim().replace(/[?.!]+$/, '');
    }
  }
  return null;
}

function addPlacesGuideCard(guide) {
  const card = document.createElement('div');
  card.className = 'fade-in self-start max-w-[95%] bg-slate-800/90 border border-slate-700 rounded-2xl rounded-bl-md p-4 flex flex-col gap-4';
  card.innerHTML = buildPlacesGuideHtml(guide);
  chatEl.appendChild(card); scrollDown();
}

async function switchSession(sessionId) {
  setSessionId(sessionId);
  toggleHistory(false);
  document.getElementById('chat').innerHTML = '';
  renderHistory();
  await loadTrip(sessionId);
}

function startNewTrip() {
  localStorage.removeItem('voyageur_session_id');
  document.getElementById('chat').innerHTML = '';
  document.getElementById('tripSwitcherLabel').textContent = 'No trip yet';
  document.getElementById('app-root').innerHTML = `
    <div class="text-center py-32 text-slate-500">

// ============================================================
// Chat rendering
// ============================================================
const chatEl = document.getElementById('chat');
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg fade-in self-end max-w-[85%] bg-gradient-to-r from-[#FF5E3A] to-[#E11D48] text-white text-sm rounded-2xl rounded-br-md px-4 py-2.5 shadow-md';
  div.textContent = text;
  chatEl.appendChild(div); scrollDown();
}
function addBotMessage(text, isError) {
  const div = document.createElement('div');
  div.className = 'msg fade-in self-start max-w-[90%] text-sm rounded-2xl rounded-bl-md px-4 py-2.5 border ' + (isError ? 'bg-rose-950/50 border-rose-600/50 text-rose-200' : 'bg-slate-800/90 border-slate-700 text-slate-100');
  div.textContent = text;
  chatEl.appendChild(div); scrollDown();
}
function addInterruptCard(interrupt) {
  const card = document.createElement('div');
  card.className = 'fade-in self-start max-w-[95%] bg-gradient-to-br from-indigo-950/60 to-slate-900 border border-indigo-500/40 rounded-2xl p-4';
  const p = document.createElement('p');
  p.className = 'text-sm text-slate-100 mb-3';
  p.textContent = interrupt.message || 'Please confirm to continue.';
  card.appendChild(p);
  const btns = document.createElement('div');
  btns.className = 'flex gap-2 flex-wrap';
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'px-3.5 py-1.5 rounded-full text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950';
  confirmBtn.textContent = interrupt.type === 'confirm_generation_issues' ? 'Proceed anyway' : 'Confirm trip';
  confirmBtn.onclick = () => sendMessage('yes');
  const changeBtn = document.createElement('button');
  changeBtn.className = 'px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200';
  changeBtn.textContent = interrupt.type === 'confirm_generation_issues' ? 'Fix the issues' : 'Change something';
  changeBtn.onclick = () => { const el = document.getElementById('messageInput'); el.placeholder = 'Tell me what to change...'; el.focus(); };
  btns.appendChild(confirmBtn); btns.appendChild(changeBtn);
  card.appendChild(btns);
  chatEl.appendChild(card); scrollDown();
}
function addItineraryNote(itinerary) {
  const div = document.createElement('div');
  div.className = 'fade-in self-start max-w-[90%] text-xs text-slate-400 px-1';
  div.textContent = `${itinerary.destination} · ${fmtINR(itinerary.estimated_total_cost)} · full itinerary is open in the background →`;
  chatEl.appendChild(div); scrollDown();
}
function showTyping() { document.getElementById('typingRow').classList.remove('hidden'); scrollDown(); }
function hideTyping() { document.getElementById('typingRow').classList.add('hidden'); }

function renderChatHistory(messages) {
  chatEl.innerHTML = '';
  if (!messages || !messages.length) {
    addBotMessage('Switched to this trip. Continue the conversation here.');
    return;
  }
  for (const m of messages) { if (m.role === 'user') addUserMessage(m.text); else addBotMessage(m.text); }
}

// ============================================================
// Networking: chat
// ============================================================
async function sendMessage(overrideText) {
  const input = document.getElementById('messageInput');
  const text = overrideText || input.value.trim();
  if (!text) return;
  if (!overrideText) addUserMessage(text);
  input.value = ''; input.placeholder = 'Tell me about your trip...';

  // "places to visit in X" / "things to do in X" etc -- answer with the
  // same categorized places guide the Explore panel uses, instead of
  // sending this to the trip-planning chat graph.
  if (!overrideText) {
    const destination = detectPlacesIntent(text);
    if (destination) {
      showTyping();
      try {
        const res = await fetch(`${getApiBase()}/places?destination=${encodeURIComponent(destination)}`);
        hideTyping();
        if (!res.ok) { addBotMessage(`Couldn't fetch places for ${destination} (${res.status}).`, true); return; }
        const guide = await res.json();
        addPlacesGuideCard(guide);
      } catch (err) {
        hideTyping();
        addBotMessage(`Couldn't reach the server: ${err.message}`, true);
      }
      return;
    }
  }

  showTyping();

  try {
    const response = await fetch(`${getApiBase()}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: getSessionId(), user_id: getUserId(), message: text }),
    });
    hideTyping();
    if (!response.ok) {
      const errBody = await response.text();
      addBotMessage(`Server error (${response.status}): ${errBody}`, true);
      setSyncState(false);
      return;
    }
    setSyncState(true);
    const data = await response.json();
    const isNewSession = !getSessionId();
    setSessionId(data.session_id);

    if (data.interrupt) {
      addInterruptCard(data.interrupt);
      upsertHistory(data.session_id, guessTitle(text), 'In progress');
    } else if (data.itinerary) {
      addItineraryNote(data.itinerary);
      upsertHistory(data.session_id, data.itinerary.destination, fmtINR(data.itinerary.estimated_total_cost));
      // The /chat response doesn't include trip_state (members/dates), only
      // /trip/{session_id} does -- so refetch the full trip instead of
      // rendering from the partial chat response. This is what used to
      // require a manual page refresh to pick up travelers/dates.
      toggleChat(false);
      await loadTrip(data.session_id);
    } else if (data.reply) {
      addBotMessage(data.reply);
      upsertHistory(data.session_id, guessTitle(text), 'In progress');
    } else {
      addBotMessage('(no response text)');
    }
    if (isNewSession) loadTrip();
  } catch (err) {
    hideTyping();
    setSyncState(false);
    addBotMessage(`Couldn't reach the server. Check the settings gear for the correct API URL. (${err.message})`, true);
  }
}
function guessTitle(text) { return text.length > 40 ? text.slice(0, 40) + '…' : text; }
function setSyncState(ok) {
  const pill = document.getElementById('syncPill');
  if (ok) { pill.className = 'hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 text-xs font-semibold'; pill.querySelector('span:last-child').textContent = 'Connected'; }
  else { pill.className = 'hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-rose-950/60 border border-rose-500/40 text-rose-400 text-xs font-semibold'; pill.querySelector('span:last-child').textContent = 'Offline'; }
}

// ============================================================
// Networking: trip
// ============================================================
function getCachedTrip(sessionId) { try { return JSON.parse(localStorage.getItem('voyageur_trip_' + sessionId) || 'null'); } catch(e) { return null; } }
function setCachedTrip(sessionId, data) { try { localStorage.setItem('voyageur_trip_' + sessionId, JSON.stringify(data)); } catch(e) {} }

async function loadTrip(sessionId) {
  sessionId = sessionId || getSessionId();
  const userId = getUserId();
  const root = document.getElementById('app-root');
  if (!sessionId) return;

  root.innerHTML = `<div class="text-center py-32 text-slate-500"><span class="material-symbols-outlined text-[28px] animate-spin block mb-2">progress_activity</span>Loading your trip…</div>`;

  try {
    const res = await fetch(`${getApiBase()}/trip/${encodeURIComponent(sessionId)}?user_id=${encodeURIComponent(userId)}`);
    if (!res.ok) {
      const cached = getCachedTrip(sessionId);
      if (cached) { renderTrip(cached); return; }
      root.innerHTML = `<div class="text-center py-32 text-rose-400 text-sm">Couldn't load this trip (${res.status}).</div>`;
      return;
    }
    setSyncState(true);
    const data = await res.json();
    renderTrip(data);
    renderChatHistory(data.messages);
  } catch (err) {
    setSyncState(false);
    const cached = getCachedTrip(sessionId);
    if (cached) { renderTrip(cached); return; }
    root.innerHTML = `<div class="text-center py-32 text-rose-400 text-sm">Couldn't reach the server: ${escapeHtml(err.message)}</div>`;
  }
}

function renderBudgetCard(itinerary) {
  const bb = itinerary.budget_breakdown || {};
  const total = itinerary.estimated_total_cost || 0;
  const segs = [
    { key:'accommodation', label:'Accommodation', color:'from-orange-500 to-amber-500', dot:'bg-orange-400' },
    { key:'transport', label:'Transport', color:'from-blue-500 to-indigo-500', dot:'bg-cyan-400' },
    { key:'activities', label:'Activities', color:'from-emerald-500 to-teal-500', dot:'bg-emerald-400' },
    { key:'miscellaneous', label:'Misc', color:'from-purple-400 to-pink-500', dot:'bg-purple-400' },
  ];
  const anySegs = segs.some(s => bb[s.key]);
  const bar = anySegs ? segs.map(s => {
    const val = bb[s.key] || 0;
    const pct = total ? Math.max(0, Math.min(100, (val/total)*100)) : 0;
    return `<div class="bg-gradient-to-r ${s.color} h-full" style="width:${pct}%" title="${s.label}: ${fmtINR(val)}"></div>`;
  }).join('') : `<div class="bg-gradient-to-r from-slate-600 to-slate-500 h-full" style="width:100%"></div>`;
  const grid = anySegs ? segs.map(s => `

      <span class="font-mono font-bold text-white">${fmtINR(bb[s.key])}</span>

  const cuts = (itinerary.budget_cuts && itinerary.budget_cuts.length) ? `
    <div class="mt-3 bg-amber-950/40 border border-amber-600/40 rounded-xl p-3">

  return `
    <div class="bg-[#141C2C]/95 rounded-2xl border border-slate-700/70 shadow-lg p-5">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">

      ${anySegs ? `<div class="grid grid-cols-2 gap-2 text-xs">${grid}</div>` : ''}

    <div class="bg-[#141C2C]/95 rounded-2xl border border-slate-700/70 shadow-lg p-5">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-8 h-8 rounded-lg bg-blue-950 text-blue-400 border border-blue-700/50 flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">luggage</span></div>
        <div><h3 class="text-sm font-extrabold text-white">Logistics</h3></div>
      </div>
      ${flightHtml}${carHtml}
    </div>`;
}

function renderNotesCard(itinerary) {
  if (!itinerary.notes) return '';
  return `
    <div class="bg-[#141C2C]/95 rounded-2xl border border-slate-700/70 shadow-lg p-5">
      <div class="flex items-center gap-2 mb-2">
        <div class="w-8 h-8 rounded-lg bg-purple-950 text-purple-400 border border-purple-700/50 flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">sticky_note_2</span></div>
        <h3 class="text-sm font-extrabold text-white">Notes</h3>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">${escapeHtml(itinerary.notes)}</p>
    </div>`;
}

let CURRENT_ITINERARY = null;

function renderTrip(data) {
  if (getSessionId()) setCachedTrip(getSessionId(), data);
  const root = document.getElementById('app-root');
  const trip = data.trip_state || {};
  const itinerary = data.itinerary;

  document.getElementById('tripSwitcherLabel').textContent = itinerary ? itinerary.destination : (trip.destination || 'Trip in progress');

  if (!itinerary) {
    root.innerHTML = `
      <div class="pt-6">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase bg-gradient-to-r from-orange-500 to-rose-600 text-white">In progress</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mt-3">${escapeHtml(trip.destination || 'Untitled trip')}</h1>
        <p class="text-sm text-slate-400 mt-2">This trip hasn't been generated yet — status: ${escapeHtml(prettyStatus(data.status))}. Continue the conversation in chat.</p>
        <button onclick="toggleChat(true)" class="mt-4 inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-gradient-to-r from-[#FF5E3A] to-[#E11D48] text-white text-xs font-bold">
          <span class="material-symbols-outlined text-[16px]">forum</span> Continue in chat
        </button>
      </div>`;
    return;
  }

  CURRENT_ITINERARY = itinerary;
  const days = itinerary.days || [];

  root.innerHTML = `
    <section class="pt-6 pb-6">
      <div class="flex flex-wrap items-center gap-2.5 mb-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase bg-gradient-to-r from-orange-500 to-rose-600 text-white shadow-[0_0_16px_rgba(249,115,22,0.35)]">
          <span class="material-symbols-outlined text-[13px]">flight_takeoff</span> ${escapeHtml(prettyStatus(data.status))}
        </span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-800/70 text-slate-300 border border-slate-700">
          <span class="material-symbols-outlined text-[15px]">groups</span> ${trip.members ?? '—'} travelers
        </span>
        ${trip.start_date ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-800/70 text-slate-300 border border-slate-700"><span class="material-symbols-outlined text-[15px]">event</span> ${escapeHtml(trip.start_date)} → ${escapeHtml(trip.end_date||'')}</span>` : ''}
      </div>
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">${escapeHtml(itinerary.destination)}</h1>
      <p class="text-xs text-slate-500 mt-1">${days.length} day${days.length===1?'':'s'} · Estimated cost ${fmtINR(itinerary.estimated_total_cost)}</p>

      <div class="relative mt-5">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 pt-1 -mx-1 px-1" id="dayRibbon">
          ${renderDayRibbon(days, 0)}
        </div>
      </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-7 flex flex-col gap-6">
        <div id="dayBlocks"></div>
      </div>
      <div class="lg:col-span-5 flex flex-col gap-6">
        ${renderHotelCard(itinerary, trip)}
        ${renderBudgetCard(itinerary)}
        ${renderFlightCarCard(itinerary)}
        ${renderNotesCard(itinerary)}
      </div>
    </div>`;

  renderDayBlocks(days, 0);
}

function renderDayBlocks(days, activeIndex) {
  const container = document.getElementById('dayBlocks');
  const d = days[activeIndex];
  if (!d) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div class="bg-[#131B2A]/90 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-slate-700/70 shadow-lg">
      <h2 class="text-xl font-extrabold text-white tracking-tight">Day ${d.day_number}${d.date ? ' · ' + escapeHtml(d.date) : ''}</h2>
      <p class="text-xs text-slate-400 mt-1 font-medium">${escapeHtml(d.summary || '')}</p>
    </div>
    <div class="relative pl-6 sm:pl-8 mt-2">
      <div class="absolute left-3 sm:left-4 top-4 bottom-4 w-1 bg-gradient-to-b from-emerald-400 via-indigo-400 to-rose-500 rounded-full opacity-70"></div>
      ${(d.activities || []).map((a, i) => renderActivityCard(a, i)).join('')}
    </div>
    ${renderMealsSection(d.meals)}
  `;
}

function showDay(index) {
  document.querySelectorAll('#dayRibbon button').forEach((el, i) => {
    // re-render ribbon fully to keep active styling consistent
  });
  if (!CURRENT_ITINERARY) return;
  document.getElementById('dayRibbon').innerHTML = renderDayRibbon(CURRENT_ITINERARY.days, index);
  renderDayBlocks(CURRENT_ITINERARY.days, index);
}

// ============================================================
// Init
// ============================================================
renderFooter();
renderHistory();
refreshServerTrips();
loadTrip();
if (!getSessionId()) {
  addBotMessage("Hi! Tell me where you'd like to go, your dates, how many travelers, and your budget — I'll put together a full itinerary.");
}
</script>
</body>
</html>
